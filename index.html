<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Pong Game - Mobile Friendly</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="scoreboard">
            <div class="score">
                <h2>Player</h2>
                <p id="playerScore">0</p>
            </div>
            <div class="score">
                <h2>Computer</h2>
                <p id="computerScore">0</p>
            </div>
        </div>
        
        <canvas id="pongCanvas"></canvas>
        
        <div class="controls">
            <p id="mobileHint" style="display:none;">Slide your finger up/down to move paddle</p>
            <p id="desktopHint">Use <strong>Mouse</strong> or <strong>Arrow Keys (↑/↓)</strong> to move your paddle</p>
            <p>Press <strong>SPACE</strong> or Tap to start/pause the game</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
